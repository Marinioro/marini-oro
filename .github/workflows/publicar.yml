name: Publicar o programa

# Roda a cada envio para a branch principal e publica as duas versões:
#   https://marinioro.github.io/marini-oro/        (oficial)
#   https://marinioro.github.io/marini-oro/teste/  (teste)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Criar configurações (chaves públicas)
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_KEY=%s\nVITE_AMBIENTE=oficial\n' "${{ vars.OFICIAL_SUPABASE_URL }}" "${{ vars.OFICIAL_SUPABASE_KEY }}" > .env.oficial
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_KEY=%s\nVITE_AMBIENTE=teste\n' "${{ vars.TESTE_SUPABASE_URL }}" "${{ vars.TESTE_SUPABASE_KEY }}" > .env.teste
      - run: npm run build:tudo
      - run: cp dist/index.html dist/404.html && cp dist/teste/index.html dist/teste/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
